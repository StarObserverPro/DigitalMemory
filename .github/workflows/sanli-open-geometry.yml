name: Sanli open building reference snapshot

on:
  push:
    branches: [agent/dm-0017-sanli-open-geometry]
    paths: [.github/workflows/sanli-open-geometry.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Overture CLI and spatial validator
        run: python -m pip install --disable-pip-version-check overturemaps==1.0.2 shapely==2.1.2
      - name: Download geographic polygons (not commercial 3D tiles)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sanli"
          overturemaps download --bbox=116.28335,39.84175,116.28935,39.84615 -f geojson --type=building -o "$RUNNER_TEMP/sanli/buildings.geojson"
          if ! overturemaps download --bbox=116.28335,39.84175,116.28935,39.84615 -f geojson --type=building_part -o "$RUNNER_TEMP/sanli/parts.geojson"; then
            echo 'Building parts unavailable; footprint-only evidence remains useful.' >&2
            printf '%s\n' '{"type":"FeatureCollection","features":[]}' > "$RUNNER_TEMP/sanli/parts.geojson"
          fi
      - name: Audit polygons versus Sanli parcel and junction-road geometry
        run: |
          python scripts/ingest-sanli-overture.py \
            --buildings "$RUNNER_TEMP/sanli/buildings.geojson" \
            --parts "$RUNNER_TEMP/sanli/parts.geojson" \
            --release latest-STAC-as-of-2026-10-19
          python -m json.tool content/reference/sanli-open-geometry.geojson > /dev/null
          python -m json.tool content/reference/sanli-open-audit.json > /dev/null
      - name: Commit only licensed small-area reference/audit to review branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/reference/sanli-open-geometry.geojson content/reference/sanli-open-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: include Overture Sanli source footprints and coverage audit'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Attach verifiable data and audit to run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanli-open-geometry
          path: |
            content/reference/sanli-open-geometry.geojson
            content/reference/sanli-open-audit.json
          if-no-files-found: ignore
