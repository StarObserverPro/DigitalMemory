name: Student avatar review checks

on:
  pull_request:
    paths:
      - 'src/explorer/schoolboy.js'
      - 'src/explorer/street-*.js'
      - 'src/explorer/stage.js'
      - 'assets/characters/schoolboy/**'
      - 'assets/vendor/three/**'
      - 'tests/schoolboy.test.mjs'
      - '.github/workflows/student-avatar-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static build and Node tests
        run: npm run check
