name: Selected outline integration
on:
  pull_request:
    paths: ['src/**','scenes/**','content/public/outline-registration.json','scripts/build.mjs','tests/**','.github/workflows/outline-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Overview period-switch browser regression
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          OVERVIEW_EVIDENCE_DIR: ${{ runner.temp }}/overview-periods
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/overview-periods.browser.mjs
