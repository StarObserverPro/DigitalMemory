name: Selected outline integration
on:
  pull_request:
    paths: ['src/**','scenes/**','content/public/outline-registration.json','scripts/build.mjs','tests/**','.github/workflows/outline-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
